services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      KUBECONFIG_PATH: /root/.kube/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${KUBECONFIG_DIR:-${USERPROFILE}/.kube}:/root/.kube:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_INSFORGE_BASE_URL: https://4fwr5aay.us-east.insforge.app
        NEXT_PUBLIC_INSFORGE_ANON_KEY: anon_c9d15cd959cd12c8977b06e38910210faf38037b607f8990378411f6c7fa682c
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_INSFORGE_BASE_URL: https://4fwr5aay.us-east.insforge.app
      NEXT_PUBLIC_INSFORGE_ANON_KEY: anon_c9d15cd959cd12c8977b06e38910210faf38037b607f8990378411f6c7fa682c
    depends_on:
      - backend
    restart: unless-stopped
